hostname Lucky7ServerSwitch
int g1/0/1
switchport mode trunk 
switchport trunk native vlan 1
int g1/0/2
switchport mode trunk 
switchport trunk native vlan 1

vtp domain lucky7branch2.com
vtp password lucky7
vtp mode server 

vlan 10
name "Cutomer Service"

vlan 20
name Staff


vlan 30
name Management

vlan 40
name Voice

vlan 50
name Wireless


vlan 25
name VIP



