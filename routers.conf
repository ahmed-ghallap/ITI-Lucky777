# B1-main Router

en
conf ter

hostname B1-main-lucky7

inter g0/1
ip address 21.0.0.2 255.255.255.252
ip ospf 1 area 0
no shutdown 


interface g0/0
no shutdown
exit

! GREEN - VLAN 20 (STAFF)
interface g0/0.20
encapsulation dot1Q 20
ip address 10.10.0.1 255.255.255.224
no shutdown
exit

! ORANGE - VLAN 40 (VOICE)
interface g0/0.40
encapsulation dot1Q 40
ip address 10.10.0.33 255.255.255.224
no shutdown
exit

! YELLOW - VLAN 50 (WIRELESS)
interface g0/0.50
encapsulation dot1Q 50
ip address 10.10.0.65 255.255.255.224
no shutdown
exit

! BLUE - VLAN 10 (CUSTOMER SERVICE)
interface g0/0.10
encapsulation dot1Q 10
ip address 10.10.0.97 255.255.255.240
no shutdown
exit

! PURPLE - VLAN 30 (MANAGEMENT)
interface g0/0.30
encapsulation dot1Q 30
ip address 10.10.0.113 255.255.255.248
no shutdown
exit

do write

