# HQ-left Router

en
conf ter

hostname HQ-left-lucky7

ip route 10.0.0.0 255.255.254.0 g0/0
ip route 0.0.0.0 0.0.0.0 g0/1

router ospf 10
redistribute static subnets 
exit


inter g0/1
ip add 10.60.60.1 255.255.255.248
ip ospf 10 area 10
no shutdown

inter g0/0
ip address 10.70.70.2 255.255.255.252
no shutdown

do write

