# HQ-Main Router

enable
conf t

hostname HQ-Main-lucky7

! ACL for PAT
access-list 1 permit 10.60.60.0 0.0.0.7
access-list 1 permit 10.80.80.0 0.0.0.3

! Static NAT
ip nat inside source static 10.80.80.2 50.50.50.2

! PAT
ip nat inside source list 1 interface g0/2 overload

! Static routes
ip route 50.50.50.2 255.255.255.255 Null0

! OSPF
router ospf 1
redistribute static subnets 
exit

! LAN
interface g0/0
ip address 10.60.60.3 255.255.255.248
ip ospf 10 area 10
ip nat inside
no shutdown
exit

! Server network
interface g0/1
ip address 10.80.80.1 255.255.255.252
ip nat inside
no shutdown
exit

! ISP
interface g0/2
ip address 61.0.0.1 255.255.255.252
ip nat outside
ip ospf 1 area 0
no shutdown
exit

end
write memory

