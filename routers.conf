# HQ-left Router

en
conf ter

hostname HQ-left-lucky7

inter g0/1
ip add 10.60.60.1 255.255.255.248
ip ospf 1 area 0
no shutdown

inter g0/0
ip address 10.70.70.2 255.255.255.252
no shutdown

do write

# HQ-Right Router

en
conf ter

hostname HQ-right-lucky7

inter g0/0
ip add 10.60.60.2 255.255.255.248
ip ospf 1 area 0
no shutdown

inter g0/1
ip address 10.50.50.2 255.255.255.252
no shutdown

do write


# HQ-Main Router

en
conf ter

hostname HQ-Main-lucky7

ip nat inside source static 10.80.80.2 50.50.50.2 
ip route 50.50.50.2 255.255.255.255 Null0

router ospf 1
redistribute static subnets

inter g0/0
ip add 10.60.60.3 255.255.255.248
ip nat outside
ip ospf 1 area 0
no shutdown

inter g0/1
ip address 10.80.80.1 255.255.255.252
ip nat inside
no shutdown

inter g0/2
ip address 61.0.0.1 255.255.255.252
ip ospf 1 area 0
ip nat outside
no shutdown

do write

